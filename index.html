<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAIUST Computer Club Card</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="card-container">
        <div class="club-card">
            <div class="card-image-box">
                <img src="https://baiust.ac.bd/wp-content/uploads/2023/11/hero-e1703928524238-1018x1024.png" alt="BAIUST Computer Club Logo" class="card-image">
            </div>

            <div class="card-content">
                <h2 class="card-title">BAIUST Computer Club</h2>
                
                <p class="card-description">
                    The hub for tech enthusiasts at BAIUST. We organize workshops, programming contests, and seminars to foster a culture of innovation and learning in computer science.
                </p>
                
                <div class="card-buttons">
                    <button class="btn btn-join">Join</button>
                    <button class="btn btn-view">View Activities</button>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
