<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <title>Responsive Profile</title>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="profile max-w-3xl bg-white rounded-2xl shadow-lg overflow-hidden p-6 md:p-10 border-2 border-grey-100">
    <div class="profile-info flex flex-col md:flex-row items-center md:items-start gap-8">
      
      <div class="img flex-shrink-0">
            <img src="image.png" alt="Profile Picture" class="w-40 h-40 object-cover rounded-full border-1 border-grey-100 shadow-md">
      </div>

      <div class="text text-center md:text-left">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-3">
          Hello, it's me <span class="text-[#037865]">rifatbroh</span>
        </h1>
        <p class="text-gray-600 leading-relaxed mb-5 max-w-md">
          A passionate programmer from Bangladesh. I love fishing, cycling, programming, and watching movies.
        </p>

        <button class="bg-black hover:bg-[#037865] text-white font-semibold px-2 py-1 rounded-lg"> Hire Me</button>

        <div class="social flex justify-center md:justify-start gap-5 mt-6 text-2xl">
          <a href="#" target="_blank" class="text-blue-700 hover:text-blue-800 transition" title="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="#" target="_blank" class="text-pink-500 hover:text-pink-600 transition" title="Instagram">
            <i class="fab fa-instagram"></i>
          </a>
          <a href="#" target="_blank" class="text-purple-600 hover:text-purple-700 transition" title="Slack">
            <i class="fab fa-slack"></i>
          </a>
          <a href="#" target="_blank" class="text-blue-600 hover:text-blue-700 transition" title="Facebook">
            <i class="fab fa-facebook"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
